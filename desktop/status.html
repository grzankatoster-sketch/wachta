<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>WACHTA</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0d1117; color: #e6edf3;
    font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  main { width: 460px; }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: 3px; font-weight: 600; }
  .podtytul { margin: 0 0 28px; color: #8b949e; font-size: 12.5px; }

  ol { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 11px; padding: 7px 0; align-items: flex-start; }

  /* Znacznik stanu kroku ma ksztalt, nie tylko kolor: kolo czekajace, obracajace sie w trakcie,
     ptaszek gotowego, krzyzyk bledu. Sam kolor nie wystarczy - ten ekran czyta sie w biegu. */
  .znak {
    flex: 0 0 auto; width: 16px; height: 16px; margin-top: 2px; border-radius: 50%;
    border: 1.5px solid #30363d; display: grid; place-items: center;
    font-size: 10px; line-height: 1; color: #0d1117;
  }
  li[data-stan="trwa"] .znak { border-color: #58a6ff; border-top-color: transparent; animation: obrot .8s linear infinite; }
  li[data-stan="gotowe"] .znak { background: #3fb950; border-color: #3fb950; }
  li[data-stan="gotowe"] .znak::after { content: "\2713"; font-weight: 700; }
  li[data-stan="blad"] .znak { background: #f85149; border-color: #f85149; }
  li[data-stan="blad"] .znak::after { content: "\00d7"; font-weight: 700; font-size: 12px; }
  @keyframes obrot { to { transform: rotate(360deg); } }

  .tresc { min-width: 0; }
  .nazwa { color: #8b949e; }
  li[data-stan="trwa"] .nazwa, li[data-stan="gotowe"] .nazwa, li[data-stan="blad"] .nazwa { color: #e6edf3; }
  .szczegol {
    display: block; margin-top: 2px; font-size: 12px; color: #6e7681;
    white-space: pre-wrap; word-break: break-word;
  }
  li[data-stan="blad"] .szczegol { color: #ff9c94; -webkit-user-select: text; user-select: text; }

  .stopka { margin-top: 26px; font-size: 11.5px; color: #6e7681; }
  button {
    margin-top: 14px; padding: 7px 16px; font: inherit; font-size: 13px;
    color: #e6edf3; background: #21262d; border: 1px solid #30363d; border-radius: 6px; cursor: pointer;
  }
  button:hover { background: #30363d; }
  button[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>WACHTA</h1>
  <p class="podtytul">Obraz sytuacyjny z danych publicznych</p>

  <ol id="kroki">
    <li data-krok="projekt"><span class="znak"></span><span class="tresc"><span class="nazwa">Katalog projektu</span><span class="szczegol"></span></span></li>
    <li data-krok="konfiguracja"><span class="znak"></span><span class="tresc"><span class="nazwa">Konfiguracja</span><span class="szczegol"></span></span></li>
    <li data-krok="silnik"><span class="znak"></span><span class="tresc"><span class="nazwa">Silnik Dockera</span><span class="szczegol"></span></span></li>
    <li data-krok="uslugi"><span class="znak"></span><span class="tresc"><span class="nazwa">Usługi</span><span class="szczegol"></span></span></li>
    <li data-krok="dane"><span class="znak"></span><span class="tresc"><span class="nazwa">Aplikacja</span><span class="szczegol"></span></span></li>
  </ol>

  <p class="stopka">
    Zamknięcie okna nie zatrzymuje zbierania danych — detektory liczą dalej.
    Żeby je wyłączyć: <code>docker compose stop</code>.
  </p>
  <button id="ponow" hidden>Spróbuj ponownie</button>
</main>

<script>
  const przycisk = document.getElementById("ponow");

  window.wachta.naKrok(({ krok, stan, szczegol }) => {
    const pozycja = document.querySelector(`li[data-krok="${krok}"]`);
    if (!pozycja) return;
    pozycja.dataset.stan = stan;
    pozycja.querySelector(".szczegol").textContent = szczegol;
    przycisk.hidden = stan !== "blad";
  });

  przycisk.addEventListener("click", () => {
    przycisk.hidden = true;
    window.wachta.ponow();
  });
</script>
</body>
</html>
