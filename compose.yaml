name: wachta

x-db-env: &db-env
  ConnectionStrings__Wachta: Host=db;Database=wachta;Username=postgres;Password=${POSTGRES_PASSWORD}

services:
  db:
    image: timescale/timescaledb-ha:pg17
    # Baza i front wstaja same po restarcie komputera. Bez tego caly stos byl martwy do czasu, az
    # ktos recznie wpisal "docker compose up" - a aplikacja, ktora trzeba codziennie reanimowac,
    # nie nadaje sie do ogladania ani analizowania.
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: wachta
    ports: ["5432:5432"]
    volumes: [dbdata:/home/postgres/pgdata]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wachta"]
      interval: 5s
      retries: 30

  migrator:
    build: { context: ., dockerfile: infra/docker/dotnet.Dockerfile, args: { PROJECT: Wachta.Db } }
    environment: *db-env
    depends_on: { db: { condition: service_healthy } }

  ingestion:
    build: { context: ., dockerfile: infra/docker/dotnet.Dockerfile, args: { PROJECT: Wachta.Ingestion } }
    environment: *db-env
    restart: unless-stopped
    depends_on: { migrator: { condition: service_completed_successfully } }

  api:
    build: { context: ., dockerfile: infra/docker/dotnet.Dockerfile, args: { PROJECT: Wachta.Api } }
    environment:
      <<: *db-env
      # Model osadzen chodzi na HOSCIE, nie w compose: "localhost" wewnatrz kontenera wskazuje na
      # sam kontener, wiec wyszukiwanie po znaczeniu odpowiadaloby 503 i wygladalo jak pusty korpus.
      Ollama__Url: ${WACHTA_OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts: ["host.docker.internal:host-gateway"]
    # Port na hoscie zmienisz przez WACHTA_API_PORT w .env, bez edycji tego pliku.
    # Wewnatrz sieci compose API zawsze nasluchuje na 8080 (tak kieruje nginx w web).
    ports: ["${WACHTA_API_PORT:-8080}:8080"]
    restart: unless-stopped
    depends_on: { migrator: { condition: service_completed_successfully } }

  detectors:
    build: { context: ., dockerfile: infra/docker/python.Dockerfile }
    environment:
      WACHTA_DB: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/wachta
      # Petla dopisuje nowe alarmy do indeksu wektorowego, wiec potrzebuje tego samego modelu
      # osadzen co API - i z tego samego powodu: "localhost" w kontenerze to ten kontener, a model
      # chodzi na HOSCIE. Ollama nieobecna = indeksowanie przepada z linijka w logu, petla idzie dalej.
      WACHTA_OLLAMA_URL: ${WACHTA_OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    depends_on: { migrator: { condition: service_completed_successfully } }

  web:
    build: { context: ., dockerfile: infra/docker/web.Dockerfile }
    restart: unless-stopped
    # Port na hoscie zmienisz przez WACHTA_WEB_PORT w .env; 8081 bywa zajete przez inne narzedzia.
    ports: ["${WACHTA_WEB_PORT:-8081}:80"]
    depends_on: [api]

volumes:
  dbdata: {}
