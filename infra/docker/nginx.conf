server {
  listen 80;
  root /usr/share/nginx/html;
  location / { try_files $uri /index.html; }

  # Kable i rurociagi. Obraz nginx nie zna rozszerzenia .geojson (poszloby jako
  # application/octet-stream) i ma gzip WYLACZONY - bez tych trzech linii przegladarka pobieralaby
  # 221 152 B zamiast 81 243 B, zmierzone na tym pliku przy domyslnym gzip_comp_level 1.
  location /dane/ {
    types { application/geo+json geojson; }
    gzip on;
    gzip_types application/geo+json;
  }
  location /api/ { proxy_pass http://api:8080; }
  location /openapi/ { proxy_pass http://api:8080; }
  location /hubs/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
  }
}
