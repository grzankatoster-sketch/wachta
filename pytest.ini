[pytest]
# Zeby "pytest" dzialalo z korzenia repozytorium, nie tylko z src/python.
# Testy integracyjne wymagaja bazy i psycopg - uruchamia je jawnie check.ps1 -Integration.
pythonpath = src/python
testpaths = src/python/tests
norecursedirs = src/python/tests/integration .git node_modules web/node_modules
